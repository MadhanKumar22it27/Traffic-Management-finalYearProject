<!DOCTYPE html>
<html>
<head>
    <title>Smart Traffic Dashboard</title>
    <style>
        body { font-family: Arial; text-align: center; background: #111; color: white; }
        .grid { display: grid; grid-template-columns: repeat(2, 200px); gap: 40px; justify-content: center; }
        .signal {
            background: #222;
            padding: 20px;
            border-radius: 10px;
        }
        .light {
            width: 50px;
            height: 50px;
            margin: 10px auto;
            border-radius: 50%;
            background: gray;
        }
        .red.active { background: red; }
        .yellow.active { background: yellow; }
        .green.active { background: lime; }
        .countdown { font-size: 20px; margin-top: 10px; }
    </style>
</head>
<body>

<h1>🚦 Smart Adaptive Traffic Dashboard</h1>

<div class="grid">
    <div class="signal" id="j0"></div>
    <div class="signal" id="j1"></div>
    <div class="signal" id="j2"></div>
    <div class="signal" id="j3"></div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
